services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securedocs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: securedocs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000_baseline.sql:/docker-entrypoint-initdb.d/000_baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedocs -d securedocs"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: securedocs
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: securedocs
      DATABASE_URL: postgresql://securedocs:${DB_PASSWORD}@db:5432/securedocs?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 1h
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env}
      FRONTEND_ORIGIN: http://localhost:8080
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
